name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch rclone sidecar
        shell: pwsh
        run: |
          $version = "v1.72.1"
          $zipName = "rclone-$version-windows-amd64.zip"
          $url = "https://downloads.rclone.org/$version/$zipName"
          New-Item -ItemType Directory -Force -Path src-tauri/binary | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$zipName" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\$zipName" -DestinationPath "$env:TEMP\rclone-dist" -Force
          $exe = Get-ChildItem -Path "$env:TEMP\rclone-dist" -Filter rclone.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "rclone.exe not found in the downloaded archive" }
          Copy-Item $exe.FullName "src-tauri/binary/rclone-x86_64-pc-windows-msvc.exe"
          & "src-tauri/binary/rclone-x86_64-pc-windows-msvc.exe" version

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ylrclone-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/ylrclone.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true