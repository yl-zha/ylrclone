[package]
name = "ylrclone"
version = "0.1.0"
description = "Mount WebDAV remotes as local drives with rclone"
authors = ["ylzha"]
license = "GPL-3.0-only"
repository = "https://github.com/yl-zha/ylrclone"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ylrclone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true